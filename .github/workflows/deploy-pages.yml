name: Deploy preview to GitHub Pages

# Builds every site in sites/<name>/ and publishes it at
# https://<owner>.github.io/<repo>/<name>/ ; portal/ becomes the landing page.
# Only the default branch may deploy (github-pages environment protection),
# so sites reach Pages by merging into it.

on:
  push:
    branches: [main, claude/healthcare-clinic-prototype-r3t0k6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build all sites
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r portal/. _site/
          for dir in sites/*/; do
            name=$(basename "$dir")
            echo "::group::Building $name"
            (cd "$dir" && npm ci && npm run build)
            mkdir -p "_site/$name"
            cp -r "$dir/dist/." "_site/$name/"
            echo "::endgroup::"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
